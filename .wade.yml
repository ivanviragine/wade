version: 2
project:
  main_branch: main
  issue_label: feature-plan
  worktrees_dir: ../.worktrees
  branch_prefix: feat
  merge_strategy: PR
ai:
  default_tool: claude
  default_model: claude-opus-5
  effort: xhigh
  plan:
    effort: xhigh
    yolo: true
  implement:
    yolo: true
  deps:
    tool: claude
    model: claude-sonnet-5
    mode: headless
    effort: high
    timeout: 900
  review_plan:
    tool: claude
    model: claude-sonnet-5
    mode: headless
    effort: high
    enabled: true
    timeout: 900
  review_implementation:
    tool: claude
    model: claude-sonnet-5
    mode: headless
    effort: high
    enabled: true
    timeout: 900
  review_batch:
    tool: claude
    model: claude-sonnet-5
    mode: interactive
    effort: high
    enabled: true
    yolo: true
  yolo: false
models:
  claude:
    easy:
      model: claude-haiku-4.5
      effort: max
    medium:
      model: claude-sonnet-5
      effort: high
    complex:
      model: claude-sonnet-5
      effort: xhigh
    very_complex:
      model: claude-opus-5
      effort: xhigh
provider:
  name: github
bot_review:
  # This repo runs CodeRabbit + Codex, not Cursor Bugbot. Bugbot is disabled so
  # expectation-verified completion (#448) doesn't wait arrival_timeout for a
  # review that never arrives on every review check. arrival_timeout/ack_timeout
  # keep their defaults (300s / 900s).
  auto_trigger: false
  bots:
  - name: coderabbit
    trigger: '@coderabbitai review'
    enabled: true
  - name: codex
    trigger: '@codex review'
    enabled: true
  - name: bugbot
    trigger: bugbot run
    enabled: false
knowledge:
  enabled: true
  path: KNOWLEDGE.md
hooks:
  post_worktree_create: scripts/setup-worktree.sh
  copy_to_worktree:
  - .env
  - .wade.yml
