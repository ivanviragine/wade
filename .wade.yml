version: 2
project:
  main_branch: main
  issue_label: feature-plan
  worktrees_dir: ../.worktrees
  branch_prefix: feat
  merge_strategy: PR
ai:
  default_tool: codex
  default_model: gpt-5.6-terra
  effort: xhigh
  permission_mode: yolo
  deps:
    mode: headless
    timeout: 900
  review_plan:
    tool: antigravity-cli
    model: gemini-3.8-flash
    mode: headless
    effort: high
    enabled: true
    timeout: 900
  review_implementation:
    tool: antigravity-cli
    model: gemini-3.8-flash
    mode: headless
    effort: high
    enabled: true
    timeout: 900
  review_batch:
    mode: interactive
    enabled: true
  review_pr_comments:
    enabled: true
models:
  codex:
    easy:
      model: gpt-5.6-terra
      effort: xhigh
    medium:
      model: gpt-5.6-terra
      effort: xhigh
    complex:
      model: gpt-5.6-sol
      effort: high
    very_complex:
      model: gpt-5.6-sol
      effort: xhigh
provider:
  name: github
bot_review:
  auto_trigger: true
  arrival_timeout: 900
  ack_timeout: 900
  bots:
  - name: coderabbit
    trigger: '@coderabbitai review'
    enabled: true
  - name: codex
    trigger: '@codex review'
    enabled: true
  - name: bugbot
    trigger: bugbot run
    enabled: false
knowledge:
  enabled: true
  path: KNOWLEDGE.md
hooks:
  post_worktree_create: scripts/setup-worktree.sh
  copy_to_worktree:
  - .env
  - .wade.yml
