version: 2
project:
  main_branch: main
  issue_label: feature-plan
  worktrees_dir: ../.worktrees
  branch_prefix: feat
  merge_strategy: PR
ai:
  default_tool: claude
  default_model: claude-opus-4.8
  effort: xhigh
  plan:
    effort: xhigh
    yolo: true
  deps:
    tool: claude
    model: claude-sonnet-5
    mode: headless
    effort: high
  review_plan:
    tool: claude
    model: claude-sonnet-5
    mode: headless
    effort: high
    enabled: true
  review_implementation:
    tool: claude
    model: claude-sonnet-5
    mode: headless
    effort: high
    enabled: true
  review_batch:
    tool: claude
    model: claude-sonnet-5
    mode: interactive
    effort: high
    enabled: true
    yolo: true
  yolo: false
models:
  claude:
    easy:
      model: claude-haiku-4.5
      effort: max
    medium:
      model: claude-sonnet-5
      effort: high
    complex:
      model: claude-sonnet-5
      effort: xhigh
    very_complex:
      model: claude-opus-4.8
      effort: xhigh
provider:
  name: github
knowledge:
  enabled: true
  path: KNOWLEDGE.md
hooks:
  post_worktree_create: scripts/setup-worktree.sh
  copy_to_worktree:
  - .env
  - .wade.yml
  - KNOWLEDGE.md
  - KNOWLEDGE.ratings.yml
